# Build and test on every push and pull request. Needs no secrets.
name: ci
on:
  push:
  pull_request:

jobs:
  scala:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # The HTTP suite starts a throwaway Postgres through testcontainers; Docker is on the runner.
      - run: sbt scalafmtCheckAll scalafmtSbtCheck test

  device:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: device
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: device/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Every commit of a pull request, and its title, is a Conventional Commit.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: .githooks/check-commits "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
